name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    # The registry token is only handed to a run that has passed this
    # environment's protection rules (required reviewers, tag
    # restrictions), which are set in the repository's settings — see
    # CONTRIBUTING.md. A pushed tag alone does not publish.
    environment: crates-io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --all-features --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --all-features --locked

      # `--locked` refuses to publish if Cargo.lock is out of date with
      # Cargo.toml, so a release can't accidentally ship against
      # dependency versions that were never actually tested by the gates
      # above.
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked
